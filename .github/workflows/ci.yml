name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy and run the end-to-end check against the deployed Worker
        type: boolean
        default: true

concurrency:
  group: skin-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Gate (typecheck, lint, tests incl. the agent killed three times offline, config and secret checks)
        run: npm run check
      - name: End to end against a local Worker (workerd + real Chromium)
        run: |
          bash test/local/run.sh
          BASE=http://localhost:8790 node scripts/e2e.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: receipt-local
          path: receipts/e2e-local.json
          if-no-files-found: ignore

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SKIN_HOST: ${{ vars.SKIN_HOST }}
          OAUTH_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID }}
          SKIN_ZONE: ${{ vars.SKIN_ZONE }}
          SMOKE_SESSION: ${{ secrets.SKIN_SESSION }}
        run: |
          set -o pipefail
          npm run deploy 2>&1 | tee deploy.log
          version=$(grep -oE 'Current Version ID: [0-9a-f-]+' deploy.log | awk '{print $4}')
          test -n "$version"
          echo "DEPLOYED_VERSION=$version" >> "$GITHUB_ENV"
          echo "deployed version $version"
      - name: Anonymous API requests are refused
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'accept: application/json' "https://${{ vars.SKIN_HOST }}/_kernel/api/body")
          echo "anonymous: $code"
          test "$code" = "401"
      - name: End to end against the deployed Worker, as two people
        env:
          BASE: https://${{ vars.SKIN_HOST }}
          SKIN_SESSION: ${{ secrets.SKIN_SESSION }}
          SKIN_SESSION_B: ${{ secrets.SKIN_SESSION_B }}
          EXPECT_VERSION: ${{ env.DEPLOYED_VERSION }}
        run: node scripts/e2e.mjs
      - if: always()
        name: Summary
        run: |
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("receipts/e2e-deployed.json")) process.exit(0);
            const r = JSON.parse(fs.readFileSync("receipts/e2e-deployed.json", "utf8"));
            const lines = [`### Deployed e2e: ${r.passed}/${r.total} in ${Math.round(r.ms / 1000)} s against version ${r.version}`, "", ...r.results.map((x) => `- ${x.pass ? "✅" : "❌"} ${x.name}${x.pass ? "" : ` — ${String(x.observed).slice(0, 300)}`}`)];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: receipt-deployed
          path: receipts/e2e-deployed.json
          if-no-files-found: ignore
